[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinkhorn-differentiable-top-k"
version = "0.1.0"
description = "Sinkhorn-based differentiable top-k patch selection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
vision = ["torchvision>=0.15"]
dev = ["pytest>=7", "torch>=2.0", "torchvision>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py"]
pythonpath = ["."]
